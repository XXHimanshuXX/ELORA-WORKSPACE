[package]
name = "elora-tauri"
version = "0.1.0"
description = "ELORA OS Desktop Overlay"
authors = ["ELORA Architects"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open", "shell-sidecar"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
