<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ELORA // LIVING MULTIVERSE CINEMA OS [GENETIC SHADER EVOLUTION & ZERO-2D-BOX ENGINE]</title>
<style>
  :root {
    --cyan: #00f5ff;
    --gold: #ffd166;
    --emerald: #06d6a0;
    --crimson: #ff0a54;
    --violet: #9d4edd;
    --bone: #f8fafc;
    --font-display: 'Orbitron', 'Rajdhani', 'Eurostile', 'Bank Gothic', sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #010206;
    color: var(--bone);
    font-family: var(--font-mono);
    cursor: crosshair;
  }

  /* ==========================================================================
     PASS 1: SELF-REWRITING GENETIC GLSL FRAGMENT SHADER CANVAS
     Every 60 seconds (or when you click "EVOLVE DNA"), ELORA literally
     rewrites the GLSL mathematical formula of the universe and recompiles it
     on the GPU in <4ms!
     ========================================================================== */
  #gl-multiverse {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    display: block;
  }

  
  #multiverse-cinema-backdrop {
    position: fixed;
    inset: -5%;
    width: 110vw;
    height: 110vh;
    z-index: 1;
    background-size: cover;
    background-position: center center;
    opacity: 0.68;
    mix-blend-mode: screen;
    pointer-events: none;
    transition: filter 0.6s ease, transform 0.15s ease-out;
    filter: contrast(1.14) saturate(1.22);
  }

  /* ==========================================================================
     PASS 2: 3D CURVED ORBITAL HOLOGRAM ARCS & CELESTIAL WORLD SPHERES CANVAS
     ZERO 2D RECTANGULAR BOXES! Every World, every self-healing DAG branch,
     every live AST code line, and every autonomous bounty stream is projected
     along 3D curved orbital rings, Dyson arcs, and wormhole tunnels!
     ========================================================================== */
  #cinema-3d-overlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 2;
    display: block;
  }

  /* ==========================================================================
     PASS 3: ANAMORPHIC WIDESCREEN CINEMA LETTERBOX & DIEGETIC FILM DIRECTOR HUD
     ========================================================================== */
  .cinema-bar-top {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 46px;
    z-index: 10;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.94) 0%, rgba(0, 0, 0, 0.45) 75%, transparent 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    pointer-events: none;
  }

  .cinema-bar-bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 82px;
    z-index: 10;
    background: linear-gradient(0deg, rgba(0, 0, 0, 0.96) 0%, rgba(0, 0, 0, 0.55) 75%, transparent 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 12px;
    gap: 8px;
    pointer-events: none;
  }

  .director-stamp {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--font-display);
    font-size: 11.5px;
    font-weight: 900;
    letter-spacing: 0.24em;
    color: var(--cyan);
    text-shadow: 0 0 14px var(--cyan);
  }

  .rec-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--crimson);
    box-shadow: 0 0 12px var(--crimson);
  }

  .evolution-telemetry {
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 10px;
    letter-spacing: 0.14em;
  }

  .evo-metric span.k { color: rgba(248, 250, 252, 0.5); }
  .evo-metric span.v { color: var(--gold); font-weight: 800; margin-left: 5px; font-variant-numeric: tabular-nums; }

  /* ANIME SUBTITLE / VOICE OF THE WORLD CINEMA STREAM */
  #cinema-subtitle-line {
    font-family: var(--font-display);
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #ffffff;
    text-shadow: 0 2px 10px #000, 0 0 22px rgba(0, 245, 255, 0.75);
    text-align: center;
    max-width: 86vw;
  }

  /* FLOATING RADIAL CHORD TRIGGER BAR (SLEEK CURVED PILLS, ZERO BOXES) */
  .cinema-controls-strip {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .arc-pill {
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(2, 6, 18, 0.78);
    border: 1px solid rgba(0, 245, 255, 0.45);
    color: var(--cyan);
    font-family: var(--font-display);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.16em;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(0, 245, 255, 0.2);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .arc-pill:hover,
  .arc-pill.active {
    background: var(--cyan);
    color: #010206;
    box-shadow: 0 0 28px var(--cyan);
    transform: translateY(-2px) scale(1.04);
  }

  .arc-pill.gold {
    border-color: var(--gold);
    color: var(--gold);
  }
  .arc-pill.gold:hover {
    background: var(--gold);
    color: #010206;
    box-shadow: 0 0 28px var(--gold);
  }

  .arc-pill.crimson {
    border-color: var(--crimson);
    color: #ffccd5;
    background: rgba(255, 10, 84, 0.2);
  }
  .arc-pill.crimson:hover {
    background: var(--crimson);
    color: #ffffff;
    box-shadow: 0 0 30px var(--crimson);
  }

  #cinematic-will-input {
    width: 340px;
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.75);
    border: 1px solid rgba(255, 209, 102, 0.5);
    color: #ffffff;
    font-family: var(--font-mono);
    font-size: 10.5px;
    outline: none;
    user-select: text;
  }
</style>
</head>

function drawArcText(ctx, str, cx, cy, radius, startAngle, charSpacingRad, color, font) {
  ctx.save();
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < str.length; i++) {
    const a = startAngle + i * charSpacingRad;
    const x = cx + Math.cos(a) * radius;
    const y = cy + Math.sin(a) * radius;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a + Math.PI * 0.5);
    ctx.fillText(str[i], 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

    oCtx.stroke();

    oCtx.beginPath();
    oCtx.ellipse(sx, sy, 34, 10, orbitAng, 0, Math.PI * 2);
    oCtx.stroke();

    oCtx.font = 'bold 9.5px "Orbitron", monospace';
    oCtx.fillStyle = '#ffffff';
    oCtx.textAlign = 'center';
    oCtx.fillText(rWorld.name.split('//')[0].trim(), sx, sy - 28);
    oCtx.restore();
  });

  // 7. CENTER SINGULARITY READOUT
  oCtx.save();
  oCtx.textAlign = 'center';
  oCtx.font = '900 22px "Orbitron", sans-serif';
  oCtx.fillStyle = '#ffffff';
  oCtx.shadowColor = realm.color;
  oCtx.shadowBlur = 18;
  oCtx.fillText(`GEN #0${shaderGen} // τ = ${(t + 1420.5).toFixed(2)}s`, cx, cy - 6);
  oCtx.font = 'bold 10px "JetBrains Mono", monospace';
  oCtx.fillStyle = realm.color;
  oCtx.fillText(realm.name, cx, cy + 14);
  oCtx.restore();
}

/* ============================================================================
   3. INTERACTIVE WORMHOLE WARP, WORLD BIRTH & PER-MINUTE GENETIC EVOLUTION
   ============================================================================ */
function warpToRealm(idx) {
  activeRealmIdx = idx % REALMS.length;
  const r = REALMS[activeRealmIdx];
  warpShock = 1.0;
  targetYaw = r.yaw;
  targetPitch = r.pitch;

  document.querySelectorAll('.arc-pill[data-world]').forEach((b, i) => {
    b.classList.toggle('active', i === activeRealmIdx);
  });
  document.getElementById('director-cam-label').textContent =
    `CAM-0${activeRealmIdx + 1} // ${r.name} [WORMHOLE LOCK]`;
  document.getElementById('cinema-subtitle-line').textContent =
    `《 WORMHOLE WARP COMPLETE: Entered ${r.name} — ${r.role}. All streams hot-mounted with 0ms restart. 》`;
}

function triggerGeneticEvolution() {
  shaderGen += 1;
  nextEvolveCountdown = 60.0;
  warpShock = 1.0;
  compileGeneticShader(shaderGen);
  const g = GENOME_PRESETS[(shaderGen - 1) % GENOME_PRESETS.length];
  document.getElementById('cinema-subtitle-line').textContent =
    `《 GENETIC EVOLUTION #0${shaderGen}: Rewrote & recompiled live GPU GLSL shader [${g.name}] in 2.1ms — Universe topology upgraded! 》`;
}

document.querySelectorAll('.arc-pill[data-world]').forEach((btn) => {
  btn.addEventListener('click', () => warpToRealm(parseInt(btn.dataset.world, 10)));
});

document.getElementById('btn-evolve-dna').addEventListener('click', triggerGeneticEvolution);

document.getElementById('btn-birth-world').addEventListener('click', () => {
  const inp = document.getElementById('cinematic-will-input');
  const mission = inp.value.trim() || 'Autonomous SaaS & Arbitrage World';
  inp.value = '';
  const newIdx = REALMS.length + 1;
  REALMS.push({
    name: `REALM 0${newIdx} // ${mission.slice(0, 24).toUpperCase()}`,
    role: `SELF-EVOLVING MISSION UNIVERSE`,
    color: '#00f5ff',
    secondary: '#ffd166',
    yaw: newIdx * 0.9,
    pitch: 0.12,
    orbitalStreams: [
      `MISSION [${mission.slice(0, 28)}] ▸ SEARCHING WEB & PROVISIONING ✓`,
      `IDENTITY VAULT [.elora/vault] ▸ SANDBOXED CREDENTIALS CREATED ✓`,
      `SELF-CODING FORGE [AST] ▸ SYNTHESIZING SOLVER ORGAN (0 RESTARTS)`,
      `AKASHIC CHAIN [SHA-256] ▸ REAL-TIME PROOF STREAM LOCKED ✓`,
    ],
    astArcs: [
      `# LIVE BIRTHED REALM 0${newIdx}: ${mission.slice(0, 34)}`,
      `async def run_world_0${newIdx}_mission(broker, vault):`,
      `    acct = await vault.auto_provision_account()`,
      `    return await broker.solve_and_verify_with_self_healing(acct)`,
    ],
    dagArcs: [
      { label: '1. Initial Web Scan & Trial [Blocked]', ok: false, angle: -0.5 },
      { label: '2. Auto-Synthesized Bypass Adapter [OK]', ok: true, angle: 0.0 },
      { label: '3. Live World Proven & Earning [✓]', ok: true, angle: 0.5 },
    ]
  });
  document.getElementById('hud-world-count').textContent = `${REALMS.length} REALMS`;
  triggerGeneticEvolution();
  warpToRealm(REALMS.length - 1);
});

document.getElementById('cinematic-will-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('btn-birth-world').click();
});

window.addEventListener('mousemove', (e) => {
  const mx = (e.clientX / window.innerWidth) * 2 - 1;
  const my = (e.clientY / window.innerHeight) * 2 - 1;
  targetYaw = REALMS[activeRealmIdx].yaw + mx * 0.45;
  targetPitch = REALMS[activeRealmIdx].pitch + my * 0.25;
});

/* --- MASTER 60 FPS CINEMA & GENETIC EVOLUTION LOOP --- */
let lastTs = performance.now();
function cinemaLoop(now) {
  const dt = Math.max(0.001, (now - lastTs) / 1000.0);
  lastTs = now;
  simTime += dt;

  // Autonomous Per-Minute Evolution Clock
  nextEvolveCountdown -= dt;
  if (nextEvolveCountdown <= 0.0) {
    triggerGeneticEvolution();
  }
  document.getElementById('hud-next-evo').textContent = `${nextEvolveCountdown.toFixed(1)}s`;

  if (warpShock > 0.002) warpShock *= 0.92;
  else warpShock = 0.0;

  // Autonomous Cinema Director smooth orbital drift
  const autoDrift = Math.sin(simTime * 0.25) * 0.18;
  camYaw += (targetYaw + autoDrift - camYaw) * 0.08;
  camPitch += (targetPitch - camPitch) * 0.08;

  if (gl && glProg) {
    gl.uniform2f(uLoc.res, glCanvas.width, glCanvas.height);
    gl.uniform1f(uLoc.time, simTime);
    gl.uniform1f(uLoc.warp, warpShock);
    gl.uniform2f(uLoc.cam, camYaw, camPitch);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  const mb = document.getElementById('multiverse-cinema-backdrop');
  if (mb) mb.style.transform = `translate3d(${(-camYaw * 18).toFixed(1)}px, ${(-camPitch * 16).toFixed(1)}px, 0) scale(${1.02 + warpShock * 0.06})`;
  renderCurvedCinemaMultiverse(simTime);
  requestAnimationFrame(cinemaLoop);
}
requestAnimationFrame(cinemaLoop);
</script>
