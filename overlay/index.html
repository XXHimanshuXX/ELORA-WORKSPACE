<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ELORA organism</title>
  <style>
    html, body { margin: 0; background: #05070a; height: 100%; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
const STATE = { time: 0, state: 0, chainOk: 1, cpuLimit: 10, ripple: 2 };

async function boot() {
  const canvas = document.getElementById("c");
  if (!navigator.gpu) {
    document.body.textContent = "WebGPU unavailable — overlay idle (honest).";
    return;
  }
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const context = canvas.getContext("webgpu");
  const format = navigator.gpu.getPreferredCanvasFormat();
  context.configure({ device, format, alphaMode: "premultiplied" });

  const code = await (await fetch("organism.wgsl")).text();
  const shader = device.createShaderModule({ code });
  const pipeline = device.createRenderPipeline({
    layout: "auto",
    vertex: { module: shader, entryPoint: "vs" },
    fragment: { module: shader, entryPoint: "fs", targets: [{ format }] },
    primitive: { topology: "triangle-list" },
  });

  const ubo = device.createBuffer({ size: 48, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bind = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: ubo } }],
  });

  window.eloraRipple = () => { STATE.ripple = 0.0; };
  window.eloraState = (s, chainOk, cpu) => {
    STATE.state = s; STATE.chainOk = chainOk; STATE.cpuLimit = cpu;
  };

  const start = performance.now();
  function frame() {
    STATE.time = (performance.now() - start) / 1000;
    STATE.ripple += 0.012;
    const data = new Float32Array([
      STATE.time, STATE.state, STATE.chainOk, STATE.cpuLimit, STATE.ripple, 0, 0, 0,
    ]);
    device.queue.writeBuffer(ubo, 0, data);
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({
      colorAttachments: [{
        view: context.getCurrentTexture().createView(),
        clearValue: { r: 0.02, g: 0.03, b: 0.04, a: 1 },
        loadOp: "clear", storeOp: "store",
      }],
    });
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bind);
    pass.draw(3);
    pass.end();
    device.queue.submit([encoder.finish()]);
    requestAnimationFrame(frame);
  }
  frame();
}
boot();
</script>
</body>
</html>
