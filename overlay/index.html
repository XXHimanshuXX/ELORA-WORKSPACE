<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>ELORA · console</title>
<!--
  The theme is not written here.

  `style#genome-style` is filled at boot from /api/aesthetic, which returns CSS
  compiled from a genome ELORA generated and recorded in its own ledger. Every
  rule in styles.css refers only to those custom properties, so adopting a new
  genome re-skins the entire console with no build step and without a single
  hand-edited colour. A fallback set lives in styles.css for the case where the
  API cannot be reached, and that case is stated on screen rather than hidden.
-->
<link rel="stylesheet" href="styles.css">
<style id="genome-style"></style>
</head>
<body>

<!-- Icon sprite. Every glyph in this console is defined here, so nothing depends
     on an emoji font the machine may not have and nothing renders as a tofu box. -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="i-genome"><path d="M7 3c0 4 10 5 10 9s-10 5-10 9"/><path d="M17 3c0 4-10 5-10 9s10 5 10 9"/><path d="M9 7h6M9 17h6M8 12h8"/></g>
    <g id="i-router"><circle cx="12" cy="12" r="3"/><path d="M3 12h6M15 12h6M12 5v4M12 15v4M6 5l2.5 2.5M18 5l-2.5 2.5M6 19l2.5-2.5M18 19l-2.5-2.5"/></g>
    <g id="i-registry"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g>
    <g id="i-ledger"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3z"/><path d="M8 3v18"/><path d="M12 8h4M12 12h4"/></g>
    <g id="i-unwired"><path d="M9 3v6M15 3v6"/><path d="M6 9h12v3a6 6 0 0 1-12 0z"/><path d="M12 18v3"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.4-4.4"/></g>
    <g id="i-evolve"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="M6.5 6.5l2.8 2.8M14.7 14.7l2.8 2.8M17.5 6.5l-2.8 2.8M9.3 14.7l-2.8 2.8"/></g>
    <g id="i-refresh"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></g>
    <g id="i-check"><path d="M4 12.5l5 5L20 6.5"/></g>
    <g id="i-x"><path d="M6 6l12 12M18 6L6 18"/></g>
    <g id="i-warn"><path d="M12 3.5L21 19H3z"/><path d="M12 9.5v4M12 16.2v.1"/></g>
    <g id="i-send"><path d="M4 12l16-8-6 16-2.5-6.5z"/></g>
    <g id="i-chip"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3v2.5M14 3v2.5M10 18.5V21M14 18.5V21M3 10h2.5M3 14h2.5M18.5 10H21M18.5 14H21"/></g>
    <g id="i-globe"><circle cx="12" cy="12" r="8.5"/><path d="M3.6 9h16.8M3.6 15h16.8"/><path d="M12 3.5c2.2 2.4 3.3 5.3 3.3 8.5s-1.1 6.1-3.3 8.5c-2.2-2.4-3.3-5.3-3.3-8.5s1.1-6.1 3.3-8.5z"/></g>
    <g id="i-terminal"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12.5 15H17"/></g>
    <g id="i-clock"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g>
    <g id="i-eye"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6"/></g>
    <g id="i-camera"><rect x="3" y="6.5" width="18" height="13" rx="2.5"/><circle cx="12" cy="13" r="3.6"/><path d="M8.5 6.5L10 4h4l1.5 2.5"/></g>
  </defs>
</svg>

<div class="shell">

  <nav class="rail" aria-label="Console sections">
    <div class="rail__mark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-genome"/></svg>
      <span>ELORA</span>
    </div>

    <ul class="rail__list">
      <li><button type="button" class="rail__item" data-nav="genome" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-genome"/></svg>
        <span>Genome</span></button></li>
      <li><button type="button" class="rail__item" data-nav="router">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-router"/></svg>
        <span>Router</span></button></li>
      <li><button type="button" class="rail__item" data-nav="registry">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-registry"/></svg>
        <span>Registry</span></button></li>
      <li><button type="button" class="rail__item" data-nav="resident">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-terminal"/></svg>
        <span>Resident</span></button></li>
      <li><button type="button" class="rail__item" data-nav="ledger">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-ledger"/></svg>
        <span>Ledger</span></button></li>
      <li><button type="button" class="rail__item" data-nav="unwired">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-unwired"/></svg>
        <span>Not wired</span></button></li>
    </ul>

    <div class="rail__foot">
      <span class="dot" id="rail-dot" data-state="pending"></span>
      <div class="rail__foot-text">
        <strong id="rail-state">connecting</strong>
        <span id="rail-host">—</span>
      </div>
    </div>
  </nav>

  <main class="main">
    <header class="topbar">
      <div class="topbar__lead">
        <h1 id="view-title">Genome</h1>
        <p id="view-sub" class="topbar__sub"></p>
      </div>
      <div class="topbar__meta" id="topbar-meta"></div>
    </header>

    <div class="views">
      <section class="view" data-view="genome" tabindex="-1">
        <h2 class="sr-only">Genome</h2>
        <div id="genome-root" class="stack"></div>
      </section>
      <section class="view" data-view="router" tabindex="-1" hidden>
        <h2 class="sr-only">Router console</h2>
        <div id="router-root" class="stack"></div>
      </section>
      <section class="view" data-view="registry" tabindex="-1" hidden>
        <h2 class="sr-only">Capability and registry browser</h2>
        <div id="registry-root" class="stack"></div>
      </section>
      <section class="view" data-view="resident" tabindex="-1" hidden>
        <h2 class="sr-only">Resident — the native bridge</h2>
        <div id="resident-root" class="stack"></div>
      </section>
      <section class="view" data-view="ledger" tabindex="-1" hidden>
        <h2 class="sr-only">Ledger</h2>
        <div id="ledger-root" class="stack"></div>
      </section>
      <section class="view" data-view="unwired" tabindex="-1" hidden>
        <h2 class="sr-only">Not wired</h2>
        <div id="unwired-root" class="stack"></div>
      </section>
    </div>
  </main>
</div>

<div id="toaster" class="toaster" aria-live="polite"></div>

<noscript><p class="noscript">This console reads live data over fetch. Enable JavaScript to use it.</p></noscript>

<script type="module" src="app.js"></script>
</body>
</html>
